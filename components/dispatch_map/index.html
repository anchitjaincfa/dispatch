<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<link href="vendor/maplibre-gl.css" rel="stylesheet" />
<script src="vendor/maplibre-gl.js"></script>
<style>
  html, body { margin:0; padding:0; background:#0a0f0d; font-family: ui-monospace, monospace; }
  #map { width:100%; height:560px; }
  .maplibregl-canvas { cursor: default; }
  .fire-handle {
    width:26px; height:26px; border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #fff1c0, #ff6a18 55%, #b53d08);
    box-shadow: 0 0 22px 8px rgba(255,106,24,.55), inset 0 0 6px rgba(255,210,74,.7);
    cursor: grab; border:2px solid #ffd24a;
  }
  .fire-handle:active { cursor: grabbing; }
  .hint {
    position:absolute; left:12px; bottom:12px; z-index:5;
    background:rgba(12,19,16,.82); border:1px solid #1d2f28; border-radius:8px;
    padding:7px 11px; color:#ffb86b; font-size:11px; backdrop-filter:blur(3px);
    pointer-events:none;
  }
  .lbl { color:#cfe3da; font-size:10px; text-shadow:0 0 3px #000; pointer-events:none;
         transform:translate(10px,-6px); white-space:nowrap; }
</style>
</head>
<body>
<div id="map"></div>
<div class="hint">🖱 drag the fire — routes re-solve on release</div>
<script>
// ---- Streamlit component handshake (bare static component, no build step) ----
function send(type, data) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, data), "*");
}
function setValue(v) { send("streamlit:setComponentValue", { value: v, dataType: "json" }); }
function ready() { send("streamlit:componentReady", { apiVersion: 1 }); }
function frameHeight(h) { send("streamlit:setFrameHeight", { height: h }); }

let MAP = null, FIRE = null, INIT = false, NONCE = 0;
// no-labels dark basemap so the FIRE and routes are the brightest things on screen (P1)
const STYLE = "https://basemaps.cartocdn.com/gl/dark-matter-nolabels-gl-style/style.json";

function circlePolygon(center, radiusDeg, n) {
  const coords = [];
  const latScale = Math.cos(center[1] * Math.PI / 180) || 1;
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * 2 * Math.PI;
    coords.push([center[0] + (radiusDeg / latScale) * Math.cos(a),
                 center[1] + radiusDeg * Math.sin(a)]);
  }
  return { type: "Feature", geometry: { type: "Polygon", coordinates: [coords] } };
}
function fc(features) { return { type: "FeatureCollection", features: features }; }
function ptFeatures(items, getC, props) {
  return items.map(it => ({ type: "Feature",
    properties: props ? props(it) : {},
    geometry: { type: "Point", coordinates: getC(it) } }));
}
function lineFeatures(routes) {
  return Object.keys(routes || {}).map(k => ({ type: "Feature", properties: {},
    geometry: { type: "LineString", coordinates: routes[k] } }))
    .filter(f => f.geometry.coordinates && f.geometry.coordinates.length >= 2);
}

function setData(id, geojson) { const s = MAP.getSource(id); if (s) s.setData(geojson); }

function buildLayers(d) {
  // sources
  MAP.addSource("fire-area", { type: "geojson", data: circlePolygon(d.fire.center, d.fire.radius, 48) });
  MAP.addSource("crew", { type: "geojson", data: fc(lineFeatures(d.crew_routes)) });
  MAP.addSource("evac", { type: "geojson", data: fc(lineFeatures(d.evac_routes)) });
  MAP.addSource("shelters", { type: "geojson", data: fc(ptFeatures(d.shelters, s => s.coord, s => ({ name: s.name }))) });
  MAP.addSource("stations", { type: "geojson", data: fc(ptFeatures(d.stations, s => s.coord, s => ({ dead: (d.dead_crews || []).includes(s.id) ? 1 : 0 }))) });
  MAP.addSource("defensible", { type: "geojson", data: fc(ptFeatures(d.defensible, p => p.coord)) });
  MAP.addSource("towns", { type: "geojson", data: fc(ptFeatures(d.towns, t => t.coord, t => ({ name: t.name, threat: (d.endangered || []).includes(t.id) ? 1 : 0 }))) });

  MAP.addLayer({ id: "fire-area", type: "fill", source: "fire-area",
    paint: { "fill-color": "#ff6a18", "fill-opacity": 0.16 } });
  MAP.addLayer({ id: "fire-ring", type: "line", source: "fire-area",
    paint: { "line-color": "#ffd24a", "line-width": 1.5, "line-opacity": 0.7 } });
  MAP.addLayer({ id: "crew", type: "line", source: "crew",
    paint: { "line-color": "#3b82f6", "line-width": 3.5, "line-opacity": 0.95 } });
  MAP.addLayer({ id: "evac", type: "line", source: "evac",
    paint: { "line-color": "#f59e0b", "line-width": 3, "line-dasharray": [2, 1.5], "line-opacity": 0.95 } });
  MAP.addLayer({ id: "defensible", type: "circle", source: "defensible",
    paint: { "circle-radius": 4, "circle-color": "#ff7a5c", "circle-opacity": 0.7 } });
  MAP.addLayer({ id: "stations", type: "circle", source: "stations",
    paint: { "circle-radius": 6, "circle-stroke-width": 1.5, "circle-stroke-color": "#bcd7fb",
             "circle-color": ["case", ["==", ["get", "dead"], 1], "#6b7280", "#3b82f6"] } });
  MAP.addLayer({ id: "shelters", type: "circle", source: "shelters",
    paint: { "circle-radius": 7, "circle-color": "#22c55e", "circle-stroke-width": 1, "circle-stroke-color": "#0a0f0d" } });
  MAP.addLayer({ id: "towns", type: "circle", source: "towns",
    paint: { "circle-radius": 6, "circle-stroke-width": 1.5, "circle-stroke-color": "#0a0f0d",
             "circle-color": ["case", ["==", ["get", "threat"], 1], "#ff5b2e", "#eab308"] } });
}

function update(d) {
  setData("fire-area", circlePolygon(d.fire.center, d.fire.radius, 48));
  setData("crew", fc(lineFeatures(d.crew_routes)));
  setData("evac", fc(lineFeatures(d.evac_routes)));
  setData("shelters", fc(ptFeatures(d.shelters, s => s.coord, s => ({ name: s.name }))));
  setData("stations", fc(ptFeatures(d.stations, s => s.coord, s => ({ dead: (d.dead_crews || []).includes(s.id) ? 1 : 0 }))));
  setData("defensible", fc(ptFeatures(d.defensible, p => p.coord)));
  setData("towns", fc(ptFeatures(d.towns, t => t.coord, t => ({ name: t.name, threat: (d.endangered || []).includes(t.id) ? 1 : 0 }))));
  // move the fire handle to match server state (unless user is mid-drag)
  if (FIRE && !FIRE._dragging) FIRE.setLngLat(d.fire.center);
}

function onRender(args) {
  const d = (args && args.data) || null;
  if (!d) return;
  if (!INIT) {
    INIT = true;
    MAP = new maplibregl.Map({
      container: "map", style: STYLE,
      center: d.center, zoom: d.zoom || 12.2, attributionControl: false,
    });
    MAP.on("load", () => {
      // P1: dim basemap road lines so our crew/evac routes are the brightest lines
      for (const ly of MAP.getStyle().layers) {
        if (ly.type === "line") {
          try { MAP.setPaintProperty(ly.id, "line-opacity", 0.28); } catch (e) {}
        }
      }
      buildLayers(d);
      // draggable fire handle
      const el = document.createElement("div"); el.className = "fire-handle";
      FIRE = new maplibregl.Marker({ element: el, draggable: true })
        .setLngLat(d.fire.center).addTo(MAP);
      FIRE._dragging = false;
      FIRE.on("dragstart", () => { FIRE._dragging = true; });
      FIRE.on("drag", () => {
        const ll = FIRE.getLngLat();
        setData("fire-area", circlePolygon([ll.lng, ll.lat], d.fire.radius, 48));
      });
      FIRE.on("dragend", () => {
        FIRE._dragging = false;
        const ll = FIRE.getLngLat();
        setValue({ lng: ll.lng, lat: ll.lat, nonce: ++NONCE });
      });
      frameHeight(566);
      setTimeout(() => { if (MAP) MAP.resize(); }, 60);
    });
    MAP.on("error", (e) => { console.error("maplibre error", e && e.error); });
  } else if (MAP && MAP.isStyleLoaded()) {
    update(d);
  } else if (MAP) {
    MAP.once("idle", () => update(d));
  }
}

window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "streamlit:render") onRender(e.data.args);
});
ready();
frameHeight(566);
</script>
</body>
</html>
